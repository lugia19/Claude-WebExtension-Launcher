# Builds the launcher for every platform on each push and pull request. The window
# (Fyne) needs cgo, so each platform builds on its own runner, through the same
# scripts used locally. The zips are kept as the run's artifacts, named as the
# self-updater expects. On a pull request, a comment links them.
#
# Pushing a version tag (git tag v3.4.0 && git push origin v3.4.0) also creates a
# draft release with the zips attached; it stays invisible to users and to the
# self-updater until it's published.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Release builds are kept with the release; other runs' zips only for a while.
  ARTIFACT_DAYS: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

jobs:
  # On a tag, check it matches Version in main.go before building anything.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep 'const Version = ' main.go | sed 's/.*"\(.*\)".*/\1/')
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Version $VERSION in main.go"
            exit 1
          fi

  windows:
    needs: check-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: go vet ./... && go test ./...
        env:
          CGO_ENABLED: "1"
      - name: Build
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/*.zip
          if-no-files-found: error
          compression-level: 0 # already zipped
          retention-days: ${{ env.ARTIFACT_DAYS }}

  linux:
    needs: check-tag
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    # The oldest supported Ubuntu: the binary needs at least the glibc it's built with.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Vet and test
        run: go vet ./... && go test ./...
        env:
          CGO_ENABLED: "1"
      - name: Build
        run: bash build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: builds/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.ARTIFACT_DAYS }}

  macos:
    needs: check-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: go vet ./... && go test ./...
        env:
          CGO_ENABLED: "1"
          # As build-all.sh builds arm64, so the cgo cache is shared with the build.
          CC: clang -arch arm64
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - name: Build
        run: bash build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: builds/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.ARTIFACT_DAYS }}

  # On a pull request, keep one comment linking the latest run's zips. Fork PRs get a
  # read-only token, so they're skipped.
  pr-artifacts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment the artifact links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- build-artifacts -->'
          ROWS=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '
            {"windows": "Windows", "ubuntu-22.04": "Linux amd64", "ubuntu-22.04-arm": "Linux arm64", "macos": "macOS (arm64 + amd64)"} as $names
            | .artifacts | sort_by(.name)[]
            | "| \($names[.name] // .name) | [\(.name).zip](\(env.RUN_URL)/artifacts/\(.id)) | \(.size_in_bytes / 1048576 | floor) MB |"')
          BODY=$(printf '%s\n### Build artifacts\n\nFor %s ([run](%s)). Kept %s days; downloading needs a GitHub login.\n\n| Platform | Download | Size |\n|---|---|---|\n%s\n' \
            "$MARKER" "${SHA:0:7}" "$RUN_URL" "$ARTIFACT_DAYS" "$ROWS")
          ID=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR" --body "$BODY"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
