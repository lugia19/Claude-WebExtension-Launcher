# Installs the latest Claude through the launcher on every OS and checks that the
# patched Claude starts, loads every extension and stays up (scripts/smoke-test.sh).
# Claude updates arrive on their own schedule and can break the patching without any
# change here (issue #68), so this also runs daily; a failed scheduled run emails the
# repository owner.
name: Smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: no user-namespace restriction, so Claude's sandbox needs no
        # AppArmor profile (and no password prompt to install one).
        runner: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # The launcher's GitHub API lookups (extension releases, its own updates) are
      # limited to 60 an hour per IP without a token, and runners share IPs.
      CWEL_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb gcc libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
      # The Windows worker runs elevated (runas), which starts it with the user's stored
      # environment rather than ours, so store the token there too.
      - name: Give the elevated worker the token
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[Environment]::SetEnvironmentVariable("CWEL_GITHUB_TOKEN", $env:CWEL_GITHUB_TOKEN, "User")'
      - name: Smoke test
        shell: bash
        timeout-minutes: 20
        run: bash scripts/smoke-test.sh
      - name: Upload the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.runner }}
          path: smoke-logs/
          retention-days: 14
